[build-system]
requires = ["hatchling<1.26"]
build-backend = "hatchling.build"

[project]
name = "django-octo-uml"
version = "0.1.1"
description = "Interactive runtime Django UML visualizer under Django-Octo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jeanpmodev", email = "jeanpmodev@gmail.com" }]
keywords = ["django", "uml", "architecture", "graphviz", "erd", "octo"]
dependencies = [
    "django>=6.1.2",
    "django-extensions>=4.1",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/jeanpmodev/django_octo_uml"
Documentation = "https://django-octo.readthedocs.io/en/latest/uml/"
Repository = "https://github.com/jeanpmodev/django_octo_uml"
Issues = "https://github.com/jeanpmodev/django_octo_uml/issues"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "locust>=2.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_octo_uml"]
include = [
    "src/django_octo_uml/templates/**/*.html",
    "src/django_octo_uml/static/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
