name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Setup Rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Synchronize dependencies
        run: |
          rye sync
          rye add --dev pytest-cov

      - name: Run database migrations
        env:
          PYTHONPATH: src
        run: rye run python manage.py migrate

      - name: Execute Unit & Integration Suite (pytest)
        env:
          PYTHONPATH: src
        run: rye run pytest --cov=django_octo_uml --cov-report=xml

      - name: Execute Behavioral Specifications (behave)
        env:
          PYTHONPATH: src
        run: rye run python manage.py behave

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
